# --- Generation (locked open-source base; matches base_qwen.yaml decoding) ---
generator:
  provider: local
  model: Qwen/Qwen2.5-7B-Instruct   # single source of truth for the locked base
  max_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  seed: 42
  dtype: bfloat16
  device_map: auto
  load_in_4bit: false

# --- Prompting ---
prompt:
  style_instruction_file: prompts/style_instruction.txt

# --- PEFT / LoRA (shared hyperparameters; r + lr come from the grid) ---
peft:
  output_dir: models/peft_lora           # overridden per cell by the sweep driver
  load_in_4bit: false
  lora:
    r: 16                                 # overridden per cell (grid)
    alpha: 32
    dropout: 0.05
    target_modules: all-linear            # LoRA on all linear layers (Phase 2)
  train:
    seed: 42
    max_seq_len: 512
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16       # effective batch = 16
    learning_rate: 2.0e-4                 # overridden per cell (grid)
    num_train_epochs: 2
    max_steps: -1
    weight_decay: 0.0
    warmup_ratio: 0.03
    lr_scheduler_type: cosine
    gradient_checkpointing: true
    logging_steps: 10
    eval_strategy: epoch
    save_strategy: epoch
    save_total_limit: 1

# --- Data ---
data:
  train_file: data/splits/train.jsonl    # 10,860 pairs
  eval_file: data/splits/val.jsonl       # dev: eval_loss for model selection
  limit: null

# --- Sweep grid ---
sweep:
  output_base: models                    # adapters land in <output_base>/peft_lora_r{r}_lr{lr}/
  grid:
    - {r: 16, lr: 2.0e-4, anchor: true}
    - {r: 8,  lr: 2.0e-4}
    - {r: 32, lr: 2.0e-4}
    - {r: 16, lr: 1.0e-4}
