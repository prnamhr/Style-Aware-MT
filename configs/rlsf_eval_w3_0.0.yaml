# Val inference for the RLSF-0 arm.

generator:
  provider: local
  model: Qwen/Qwen2.5-7B-Instruct
  adapter_path: models/rlsf_grpo_w3_0.0/checkpoint-200    # step200, selected on the dev slice
  max_tokens: 1024
  temperature: 0.0          # greedy, deterministic (locked decoding)
  top_p: 1.0
  seed: 42
  dtype: bfloat16
  device_map: auto
  load_in_4bit: false

prompt:
  style_instruction_file: prompts/style_instruction.txt

data:
  eval_file: data/splits/val.jsonl
  limit: null

output:
  dir: outputs
  name: rlsf_w3_0.0
