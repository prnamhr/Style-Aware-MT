# Generation (Anthropic messages API)
generator:
  provider: anthropic
  model: claude-fable-5-1
  max_tokens: 1024
  thinking: true
  effort: low
  temperature: null 
  pricing: [10.00, 40.00]

# Prompting
prompt:
  style_instruction_file: prompts/style_instruction.txt
  ordering: most_similar_last
  ordering_seed: 42
  word_pairs: true
  glossary_file: prompts/register_glossary.tsv

retrieval:
  embed_model: intfloat/multilingual-e5-large-instruct
  index_dir: data/knn_index
  train_file: data/splits/train.jsonl
  k: 8

rarity:
  min_df: 40
  freeze_n: 500
  zwnj: keep
  out: results/rarity_train.json

sparse:
  m: 4

# Data
data:
  eval_file: data/splits/val.jsonl
  limit: null

# Output
output:
  dir: outputs
  name: fable5_sparse_knn
