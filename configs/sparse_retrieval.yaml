# Rarity-driven sparse retrieval: diagnostics only, no generator block.
retrieval:
  embed_model: intfloat/multilingual-e5-large-instruct
  index_dir: data/knn_index
  train_file: data/splits/train.jsonl
  k: 8

rarity:
  min_df: 2                 # df==1 is one-off noise, not vocabulary
  freeze_n: 500             # the list is a fixed size, so its df range is an outcome
  zwnj: keep
  out: results/rarity_train.json

sparse:
  m: 4                      # rarity slots; the remaining k-m are cosine top-k
  min_query_terms: 1        # below this the query routes entirely to cosine
  redundancy: 0.3           # penalty on similarity to already-selected exemplars

leakage:
  cos: 0.95
  jaccard: 0.7
  char_n: 4
  top_m: 10
  quarantine_file: data/splits/pool_quarantine.json

data:
  eval_file: data/splits/val.jsonl
  limit: null

output:
  dir: results
