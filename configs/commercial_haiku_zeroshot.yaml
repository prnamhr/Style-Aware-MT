# COMMERCIAL REFERENCE BASELINE -- claude-haiku-4-5, zero-shot.

# Generation (Anthropic messages API) 
generator:
  provider: anthropic
  model: claude-haiku-4-5
  max_tokens: 1024
  thinking: false
  temperature: 0.0

# Prompting (identical to configs/base_qwen.yaml) 
prompt:
  style_instruction_file: prompts/style_instruction.txt

# Data
data:
  eval_file: data/splits/val.jsonl
  limit: null

# Output 
output:
  dir: outputs
  name: commercial_haiku
