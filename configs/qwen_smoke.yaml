# ============================================================================
# LOCAL QWEN LOOP-VALIDATION SMOKE -- validates the local generator end to end,
# NOT a source of thesis findings (a 5-segment slice is not an evaluation).
# ----------------------------------------------------------------------------
# Same frozen base and LOCKED decoding as configs/base_qwen.yaml; the only
# differences are data.limit (5 segments) and this header. Unlike the
# commercial-API smoke configs, this runs the REAL thesis base (Qwen2.5-7B) --
# it just runs too few segments to report. For the full dev run, use
# configs/base_qwen.yaml (data.limit: null).
#
# Intended target: a >=16GB-VRAM GPU (e.g. Colab T4/L4/A100) so the 7B base
# loads in full bf16. device_map: auto lets accelerate place it. On <=8GB VRAM,
# set load_in_4bit: true (needs bitsandbytes) -- but note that quantizes the base.
#
# Run:
#   python -m src.infer.run --condition reference --config configs/qwen_smoke.yaml
# ============================================================================

# --- Generation (local open-source base; decoding LOCKED, matches base_qwen.yaml) ---
generator:
  provider: local
  model: Qwen/Qwen2.5-7B-Instruct
  max_tokens: 1024
  temperature: 0.0          # greedy, deterministic
  top_p: 1.0
  seed: 42
  dtype: bfloat16
  device_map: auto
  load_in_4bit: false       # set true only to fit on <=8GB VRAM (quantizes the base)

# --- Prompting ---
prompt:
  style_instruction_file: prompts/style_instruction.txt

# --- Retrieval (unused by the reference condition; kept for knn_fewshot/afsp smokes) ---
retrieval:
  embed_model: intfloat/multilingual-e5-large-instruct
  index_dir: data/knn_index
  train_file: data/splits/train.jsonl
  k: 4

# --- Data ---
# DEV split only. test.jsonl stays sealed until the final evaluation.
data:
  eval_file: data/splits/val.jsonl
  limit: 5                   # loop-validation slice; use base_qwen.yaml for the full run

# --- Output ---
output:
  dir: outputs
